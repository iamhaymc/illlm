<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Vibrating water drop changing from blue to green — dotted outline style">
  <defs>
    <linearGradient id="dotLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1FA2FF"/>
      <stop offset="1"   stop-color="#22C55E"/>
    </linearGradient>
  </defs>

<!-- dotted / dashed drop outline, centered -->
   <g transform="translate(0 -7)">
     <path d="M60 14 C 60 14 96 64 96 84 A 36 36 0 1 1 24 84 C 24 64 60 14 60 14 Z"
          fill="url(#dotLine)" fill-opacity="0.12"
          stroke="url(#dotLine)" stroke-width="4"
          stroke-dasharray="1 8" stroke-linecap="round" stroke-linejoin="round"/>

     <!-- solid inner core for legibility -->
     <path d="M60 30 C 60 30 84 66 84 82 A 24 24 0 1 1 36 82 C 36 66 60 30 60 30 Z"
          fill="url(#dotLine)" fill-opacity="0.35"/>
  </g>
</svg>
