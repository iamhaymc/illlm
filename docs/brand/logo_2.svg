<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Vibrating water drop changing from blue to green — vibration ripples style">
  <defs>
    <linearGradient id="ripple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3AB4FF"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

<!-- filled drop, centered -->
   <g transform="translate(0 -1)">
     <path d="M60 12 C 60 12 92 58 92 78 A 32 32 0 1 1 28 78 C 28 58 60 12 60 12 Z"
          fill="url(#ripple)"/>
     <ellipse cx="46" cy="66" rx="10" ry="14" fill="#ffffff" opacity="0.35"/>
   </g>
</svg>
