<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Vibrating water drop changing from blue to green — monoline with motion trails">
  <defs>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1FA2FF"/>
      <stop offset="1"   stop-color="#22C55E"/>
    </linearGradient>
  </defs>

<!-- single continuous monoline drop, centered -->
   <g transform="translate(0 -7)">
     <path d="M60 14 C 60 14 96 64 96 84 A 36 36 0 1 1 24 84 C 24 64 60 14 60 14 Z"
          fill="none" stroke="url(#mono)" stroke-width="4.5"
          stroke-linejoin="round" stroke-linecap="round"/>
   </g>
</svg>
